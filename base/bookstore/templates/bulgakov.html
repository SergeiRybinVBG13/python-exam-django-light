{%extends 'base.html' %} {%block my_content%}
<head><title>{%block title%}Все книги от автора {{author.name}}{%endblock%}</title></head>
<table class="table table-dark table-stripped">
    <thead>
        <tr>
            <th>Название</th>
            <th>Автор</th>
            <th>Цена, руб.</th>
            <th>Год</th>
            <th>Действие</th>
        </tr>
    </thead>
    <tbody>
        {% for book in books %}
        <tr>
            <td>
                <a href={% url "single_book" book.id %}>{{book.title}}</a>
            </td>
            <td>{{ book.author}}</td>
            <td>{{ book.price}}</td>
            <td>{{ book.year}}</td>
            <td><button class="btn btn-secondary">Купить</button></td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
